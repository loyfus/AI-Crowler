# .github/workflows/scrape.yml
name: Scrape FutureTools

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  scrape:
    environment: .env
    runs-on: ubuntu-latest
    env:
      JETBOOST_ID:       ${{ secrets.JETBOOST_ID }}
      MONGODB_URI:       ${{ secrets.MONGODB_URI }}
      MONGODB_DB_NAME:   ${{ secrets.MONGODB_DB_NAME }}
      CONCURRENCY:       ${{ secrets.CONCURRENCY || '5' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Run scraper
        run: node index.js
